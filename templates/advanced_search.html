{% extends 'base.html' %}
{% block content %}
<h1>Расширенный поиск</h1>
<form method="get">
    <input type="text" name="number" value="{{ number or '' }}" placeholder="Номер">
    <input type="text" name="title" value="{{ title or '' }}" placeholder="Название">
    <input type="text" name="year" value="{{ year or '' }}" placeholder="Год">
    <input type="text" name="scope" value="{{ scope or '' }}" placeholder="Область применения">
    <input type="text" name="keywords" value="{{ keywords or '' }}" placeholder="Ключевые слова">
    <button type="submit">Искать</button>
</form>
<ul>
    {% for gost in gosts %}
        <li><a href="{{ url_for('gost_detail', gost_id=gost.id) }}">{{ gost.number }} - {{ gost.title }}</a></li>
    {% else %}
        <li>Ничего не найдено</li>
    {% endfor %}
</ul>
{% endblock %}
